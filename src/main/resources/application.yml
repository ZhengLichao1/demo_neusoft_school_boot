#web端口号访问路径
server:
  port: 8080
  servlet:
    context-path: /school_boot
#数据库路径
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/school_boot?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
#mybatis小驼峰设置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
